<main id="main">

  <section class="page-hero">
    <div class="container">
      <span class="kicker" data-i18n="contact.kicker"></span>
      <h1 data-i18n="contact.title"></h1>
      <p data-i18n="contact.introText"></p>
      <p><a href="faq.html" style="color:#fff;text-decoration:underline;font-weight:600;" data-i18n="common.faqTeaser"></a></p>
    </div>
  </section>

  <section class="section">
    <div class="container grid grid--2" style="align-items:start;">

      <div class="booking-panel">
        <h3 data-i18n="contact.formTitle"></h3>
        <form id="contactForm" novalidate>
          <div class="form-field">
            <label for="fullName" data-i18n="contact.nameLabel"></label>
            <input type="text" id="fullName" name="fullName" autocomplete="name">
            <span class="field-error"></span>
          </div>
          <div class="form-field">
            <label for="contactEmail" data-i18n="contact.emailLabel"></label>
            <input type="email" id="contactEmail" name="email" autocomplete="email">
            <span class="field-error"></span>
          </div>
          <div class="form-field">
            <label for="subject" data-i18n="contact.subjectLabel"></label>
            <input type="text" id="subject" name="subject" data-i18n-placeholder="contact.subjectPlaceholder">
          </div>
          <div class="form-field">
            <label for="contactMessage" data-i18n="contact.messageLabel"></label>
            <textarea id="contactMessage" name="message" rows="5" data-i18n-placeholder="contact.messagePlaceholder"></textarea>
            <span class="field-error"></span>
          </div>
          <button type="submit" class="btn btn--primary btn--lg btn--block" id="contactSubmitBtn" data-i18n="contact.submitButton"></button>
          <div class="form-notice" id="contactFormNotice" hidden></div>
        </form>
      </div>

      <div>
        <div class="card" style="margin-bottom:24px;">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M2 21v-1c0-3 2.5-5 6-5s6 2 6 5v1"/><path d="M14 21v-1c0-2.2 1.6-4 4-4.4"/></svg>
          </div>
          <h3 data-i18n="contact.hostTitle"></h3>
          <p data-i18n="contact.hostText"></p>
          <p style="font-size:0.85rem;color:var(--color-ink-faint);" data-i18n="contact.responseTimeNote"></p>
        </div>

        <div class="card">
          <h3 data-i18n="contact.directTitle"></h3>
          <ul class="rules-list" style="margin-top:12px;">
            <li>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5c0-1 1-2 2-2h2l2 4-2 2c1 3 3 5 6 6l2-2 4 2v2c0 1-1 2-2 2C10 17 4 11 4 5z"/></svg>
              <span><strong data-i18n="contact.directPhone"></strong> — +49 179 3590317</span>
            </li>
            <li>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
              <span><strong data-i18n="contact.directEmail"></strong> — ferienhausmatic@gmail.com</span>
            </li>
          </ul>
        </div>
      </div>

    </div>
  </section>
