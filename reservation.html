<main id="main">

  <section class="page-hero">
    <div class="container">
      <span class="kicker" data-i18n="reservation.kicker"></span>
      <h1 data-i18n="reservation.title"></h1>
      <p data-i18n="reservation.introText"></p>
      <p><a href="faq.html" style="color:#fff;text-decoration:underline;font-weight:600;" data-i18n="common.faqTeaser"></a></p>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <div class="section-head" style="margin-bottom:24px;">
        <span class="kicker" data-i18n="reservation.apartmentSelectorKicker"></span>
        <h2 class="section-title" style="font-size:1.4rem;" data-i18n="reservation.apartmentSelectorTitle"></h2>
      </div>
      <div class="apartment-select-wrap">
        <select id="apartmentSelect" aria-label="Choix de l'appartement">
          <option value="apt1" data-i18n="apartments.apt1.name"></option>
          <option value="apt2" data-i18n="apartments.apt2.name"></option>
          <option value="apt3" data-i18n="apartments.apt3.name"></option>
        </select>
      </div>

      <div class="booking-layout">

        <div class="booking-panel">
          <h3 data-i18n="reservation.calendarTitle"></h3>
          <div class="calendar-nav">
            <button type="button" id="calPrev" data-i18n-aria-label="reservation.prevMonth">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <button type="button" id="calNext" data-i18n-aria-label="reservation.nextMonth">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
          <div class="calendar-months" id="calendarMonths"></div>
          <div class="calendar-legend">
            <span class="calendar-legend-item"><span class="legend-dot legend-dot--available"></span><span data-i18n="reservation.legendAvailable"></span></span>
            <span class="calendar-legend-item"><span class="legend-dot legend-dot--unavailable"></span><span data-i18n="reservation.legendUnavailable"></span></span>
            <span class="calendar-legend-item"><span class="legend-dot legend-dot--selected"></span><span data-i18n="reservation.legendSelected"></span></span>
          </div>
          <p class="min-nights-note" id="minNightsNote"></p>
        </div>

        <div class="booking-panel">
          <h3 data-i18n="reservation.priceBreakdownTitle"></h3>
          <div class="summary-dates">
            <div class="summary-date-box">
              <div class="label" data-i18n="reservation.checkinLabel"></div>
              <div class="value" id="summaryCheckin">—</div>
            </div>
            <div class="summary-date-box">
              <div class="label" data-i18n="reservation.checkoutLabel"></div>
              <div class="value" id="summaryCheckout">—</div>
            </div>
          </div>
          <div id="priceBreakdown" hidden></div>
          <div class="select-dates-prompt" id="selectDatesPrompt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
            <span data-i18n="reservation.selectDatesPrompt"></span>
          </div>
        </div>

      </div>

      <div class="booking-panel" style="max-width:920px;margin:40px auto 0;">
        <span class="kicker" data-i18n="reservation.formKicker"></span>
        <h3 data-i18n="reservation.formTitle"></h3>
        <form id="bookingForm" novalidate>
          <div class="visually-hidden" aria-hidden="true" style="position:absolute;left:-9999px;">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <div class="form-grid">
            <div class="form-field">
              <label for="firstName" data-i18n="reservation.firstNameLabel"></label>
              <input type="text" id="firstName" name="firstName" autocomplete="given-name">
              <span class="field-error"></span>
            </div>
            <div class="form-field">
              <label for="lastName" data-i18n="reservation.lastNameLabel"></label>
              <input type="text" id="lastName" name="lastName" autocomplete="family-name">
              <span class="field-error"></span>
            </div>
            <div class="form-field">
              <label for="email" data-i18n="reservation.emailLabel"></label>
              <input type="email" id="email" name="email" autocomplete="email">
              <span class="field-error"></span>
            </div>
            <div class="form-field">
              <label for="phone" data-i18n="reservation.phoneLabel"></label>
              <input type="tel" id="phone" name="phone" autocomplete="tel">
              <span class="field-error"></span>
            </div>
            <div class="form-field">
              <label for="adults" data-i18n="reservation.adultsLabel"></label>
              <select id="adults" name="adults">
                <option value="1">1</option>
                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
              </select>
            </div>
            <div class="form-field">
              <label for="children" data-i18n="reservation.childrenLabel"></label>
              <select id="children" name="children">
                <option value="0" selected>0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </div>
            <div class="form-field span-2">
              <label for="message" data-i18n="reservation.messageLabel"></label>
              <textarea id="message" name="message" data-i18n-placeholder="reservation.messagePlaceholder"></textarea>
            </div>
          </div>

          <div class="checkbox-field">
            <input type="checkbox" id="consent" name="consent">
            <label for="consent" data-i18n="reservation.consentLabel"></label>
          </div>
          <span class="field-error" id="consentError"></span>

          <button type="submit" class="btn btn--primary btn--lg btn--block" id="bookingSubmitBtn" data-i18n="reservation.submitButton" disabled></button>

          <div class="form-notice" id="bookingFormNotice" hidden></div>
        </form>
      </div>

    </div>
  </section>

</main>
